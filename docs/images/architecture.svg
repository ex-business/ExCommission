<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#64748b"/></marker></defs><rect width="1080" height="300" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="36" fill="#0f172a" font-size="20" font-weight="700">页面、身份与佣金业务分别管理</text><g fill="white" stroke="#cbd5e1"><rect x="30" y="75" width="220" height="85" rx="8"/><rect x="300" y="75" width="220" height="85" rx="8"/><rect x="570" y="75" width="220" height="85" rx="8"/><rect x="840" y="75" width="210" height="85" rx="8"/><rect x="570" y="215" width="220" height="60" rx="8"/></g><g fill="#334155" font-size="15"><text x="47" y="105" font-weight="700">两套独立身份</text><text x="47" y="135">运营账号 / 会员账号</text><text x="317" y="105" font-weight="700">ExCommission-Web</text><text x="317" y="135">页面、登录与请求转发</text><text x="587" y="105" font-weight="700" fill="#1d4ed8">ExCommission API</text><text x="587" y="135">权限、规则、审批与账务</text><text x="857" y="105" font-weight="700">业务数据库</text><text x="857" y="135">版本、记录与账簿</text><text x="587" y="241" font-weight="700">ExCommission Worker</text><text x="587" y="262">异步计算与日结</text></g><g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M250 117H295"/><path d="M520 117H565"/><path d="M790 117H835"/><path d="M680 215V165"/></g><text x="30" y="246" fill="#64748b" font-size="14">箭头表示协作关系；身份服务提供身份和角色，</text><text x="30" y="269" fill="#64748b" font-size="14">佣金服务自行校验业务权限和站点。</text></g></svg>