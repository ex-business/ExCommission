<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" style="max-width:100%;height:auto;display:block" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">代理与佣金系统架构</title><desc id="desc">运营身份和会员身份独立；业务API与独立执行服务共享佣金业务库和规则模块，钱包渠道接入另行扩展。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7892a6"/></marker></defs><rect width="1440" height="820" fill="#f5f8fb"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263f52"><text x="40" y="43" font-size="25" font-weight="700">代理与佣金：业务控制、身份与执行分别管理</text><path d="M320 135H445" fill="none" stroke="#7892a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 135H875" fill="none" stroke="#7892a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 405H445" fill="none" stroke="#7892a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 405H875" fill="none" stroke="#7892a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 350V195" fill="none" stroke="#7892a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M190 610V530H490V465" fill="none" stroke="#7892a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M1015 610V465" fill="none" stroke="#7892a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M1250 665H1290V465" fill="none" stroke="#7892a6" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="40" y="80" width="280" height="115" rx="10" fill="#fff" stroke="#c7d4df"/><text x="58" y="111" font-size="18" font-weight="600">ex-ops-identity-web</text><text x="58" y="140" font-size="15" fill="#64748b">运营账号 / 角色 / 站点管理</text><rect x="450" y="80" width="300" height="115" rx="10" fill="#fff" stroke="#c7d4df"/><text x="468" y="111" font-size="18" font-weight="600">ex-ops-identity</text><text x="468" y="140" font-size="15" fill="#64748b">公共运营身份服务</text><text x="468" y="163" font-size="15" fill="#64748b">不保存佣金业务数据</text><rect x="880" y="80" width="270" height="115" rx="10" fill="#fff" stroke="#c7d4df"/><text x="898" y="111" font-size="18" font-weight="600">运营身份数据库</text><text x="898" y="140" font-size="15" fill="#64748b">账号 / 授权 / 会话 / 审计</text><rect x="40" y="350" width="280" height="115" rx="10" fill="#fff" stroke="#c7d4df"/><text x="58" y="381" font-size="18" font-weight="600">ExCommission-Web</text><text x="58" y="410" font-size="15" fill="#64748b">代理后台 / 会员代理页面</text><text x="58" y="433" font-size="15" fill="#64748b">服务端BFF与会话</text><rect x="450" y="350" width="300" height="115" rx="10" fill="#eaf2f8" stroke="#9db8ce"/><text x="468" y="381" font-size="18" font-weight="600">ExCommission API</text><text x="468" y="410" font-size="15" fill="#64748b">接入 / 规则 / 审批 / 查询</text><text x="468" y="433" font-size="15" fill="#64748b">保存任务，读取执行结果</text><rect x="880" y="350" width="270" height="115" rx="10" fill="#fff" stroke="#c7d4df"/><text x="898" y="381" font-size="18" font-weight="600">佣金业务数据库</text><text x="898" y="410" font-size="15" fill="#64748b">事实 / 权益 / 账本</text><text x="898" y="433" font-size="15" fill="#64748b">任务 / 日结 / 审批</text><rect x="40" y="610" width="300" height="115" rx="10" fill="#fff" stroke="#c7d4df"/><text x="58" y="641" font-size="18" font-weight="600">ex-member-sandbox</text><text x="58" y="670" font-size="15" fill="#64748b">独立会员身份与模拟事实库</text><text x="58" y="693" font-size="15" fill="#64748b">验签投递注册 / 充值 / 投注</text><rect x="860" y="610" width="390" height="115" rx="10" fill="#eaf2f8" stroke="#9db8ce"/><text x="878" y="641" font-size="18" font-weight="600">ex-commission-executor</text><text x="878" y="670" font-size="15" fill="#64748b">独立后台执行进程</text><text x="878" y="693" font-size="15" fill="#64748b">计佣 / 日结 / 派发与退款恢复</text><rect x="1180" y="350" width="220" height="115" rx="10" fill="#fff" stroke="#c7d4df"/><text x="1198" y="381" font-size="18" font-weight="600">ex-wallet-sandbox</text><text x="1198" y="410" font-size="15" fill="#64748b">独立模拟钱包与数据库</text><text x="1198" y="433" font-size="15" fill="#64748b">派发 / 回执 / 对账</text><text x="627" y="275" font-size="14" fill="#657e91">身份复核</text><text x="675" y="525" font-size="14" fill="#657e91">固定版本共享业务模块，规则只有一份</text><text x="955" y="552" font-size="14" fill="#657e91">读取任务 / 写回结果</text><text x="42" y="554" font-size="14" fill="#657e91">会员身份核验与签名事件</text><text x="1190" y="513" font-size="14" fill="#657e91">虚线：渠道适配扩展</text><text x="40" y="774" font-size="16" fill="#526b7d">API通过业务库任务触发执行服务，不是HTTP远程执行调用。钱包渠道适配另分支，完整协议与实现状态见架构文档。</text></g></svg>
