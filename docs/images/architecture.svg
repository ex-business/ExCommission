<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="980" height="470" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="37" font-size="24" font-weight="700" fill="#172554">ExCommission：代理与佣金业务后端</text><text x="30" y="63" font-size="14" fill="#475569">身份分离，业务规则、独立审批和账务处理保留在佣金系统</text><rect x="30" y="90" width="250" height="94" rx="9" fill="white" stroke="#94a3b8"/><text x="45" y="118" font-size="17" font-weight="700" fill="#1e3a8a">ExCommission-Web</text><text x="45" y="143" font-size="13" fill="#334155">管理后台 / 会员代理页面</text><text x="45" y="165" font-size="12" fill="#475569">19486：操作入口与同源转发</text><rect x="350" y="90" width="280" height="94" rx="9" fill="white" stroke="#94a3b8"/><text x="365" y="118" font-size="17" font-weight="700" fill="#1e3a8a">ExCommission API</text><text x="365" y="143" font-size="13" fill="#334155">规则、关系、奖励、审批、账务</text><text x="365" y="165" font-size="12" fill="#475569">19286：业务授权与幂等事务</text><rect x="700" y="90" width="250" height="94" rx="9" fill="white" stroke="#94a3b8"/><text x="715" y="118" font-size="17" font-weight="700" fill="#1e3a8a">业务数据库</text><text x="715" y="143" font-size="13" fill="#334155">业务记录 / 版本 / 账簿 / 审计</text><text x="715" y="165" font-size="12" fill="#475569">按租户与应用隔离</text><rect x="30" y="270" width="250" height="94" rx="9" fill="white" stroke="#94a3b8"/><text x="45" y="298" font-size="17" font-weight="700" fill="#1e3a8a">运营身份服务</text><text x="45" y="323" font-size="13" fill="#334155">运营账号 / 站点 / 角色</text><text x="45" y="345" font-size="12" fill="#475569">19587：业务权限由本系统映射</text><rect x="350" y="270" width="280" height="94" rx="9" fill="white" stroke="#94a3b8"/><text x="365" y="298" font-size="17" font-weight="700" fill="#1e3a8a">ExCommission Worker</text><text x="365" y="323" font-size="13" fill="#334155">计算任务 / 日结 / 异步处理</text><text x="365" y="345" font-size="12" fill="#475569">19287：按配置运行</text><rect x="700" y="270" width="250" height="94" rx="9" fill="white" stroke="#94a3b8"/><text x="715" y="298" font-size="17" font-weight="700" fill="#1e3a8a">模拟会员系统</text><text x="715" y="323" font-size="13" fill="#334155">会员身份 / 邀请注册 / 来源事件</text><text x="715" y="345" font-size="12" fill="#475569">19386 / 19387：独立会员账号</text><path d="M280 130H345" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 130H695" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 270V190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M155 184V265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 270V215H630V170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="165" y="230" font-size="12" fill="#475569">运营身份校验</text><text x="500" y="235" font-size="12" fill="#475569">共享业务规则</text><text x="705" y="205" font-size="12" fill="#475569">受信会员接入</text><text x="30" y="408" font-size="15" font-weight="700" fill="#172554">业务流程</text><text x="30" y="436" font-size="14" fill="#334155">条件配置 → 试算 → 发布审批 → 生效 → 计算与日结 → 审核 → 领取 / 付款回执 → 报表</text></g></svg>