<svg xmlns="http://www.w3.org/2000/svg" width="840" height="354" viewBox="0 0 840 354"><rect width="840" height="354" rx="12" fill="#f8fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="43" font-size="23" fill="#172554" font-weight="700">ExCommission</text><text x="32" y="70" font-size="15" fill="#475569">代理与佣金业务后端</text><rect x="24" y="94" width="792" height="49" rx="6" fill="white"/><text x="42" y="124" font-size="16" font-weight="700" fill="#1e3a8a">规则配置</text><text x="180" y="124" font-size="15" fill="#334155">等级条件、返佣比例、奖励阶梯、去重规则</text><rect x="24" y="153" width="792" height="49" rx="6" fill="white"/><text x="42" y="183" font-size="16" font-weight="700" fill="#1e3a8a">代理管理</text><text x="180" y="183" font-size="15" fill="#334155">邀请关系、资格等级、团队与下线</text><rect x="24" y="212" width="792" height="49" rx="6" fill="white"/><text x="42" y="242" font-size="16" font-weight="700" fill="#1e3a8a">佣金处理</text><text x="180" y="242" font-size="15" fill="#334155">试算、计算、日结、审核、领取与付款记录</text><rect x="24" y="271" width="792" height="49" rx="6" fill="white"/><text x="42" y="301" font-size="16" font-weight="700" fill="#1e3a8a">运营查询</text><text x="180" y="301" font-size="15" fill="#334155">报表导出、风控处理、安全审计</text></g></svg>