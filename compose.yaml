name: excommission-local
services:
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先生成本地 .env}
      MYSQL_DATABASE: excommission
      MYSQL_USER: excommission
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成本地 .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D excommission -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
  api:
    build:
      context: .
      target: runtime
    image: excommission-local-runtime:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_ADDRESS: mysql:3306
      DB_USER: excommission
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成本地 .env}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    image: excommission-local-runtime:dev
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DB_ADDRESS: mysql:3306
      DB_USER: excommission
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成本地 .env}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15
  database-check:
    profiles: ["verify"]
    build:
      context: .
      target: integration-test
    environment:
      TEST_MYSQL_ADDRESS: mysql:3306
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成本地 .env}
    depends_on:
      mysql:
        condition: service_healthy
  contract-check:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: deploy/local/contracts.Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
volumes:
  mysql-data:
