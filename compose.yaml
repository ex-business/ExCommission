name: excommission-local
services:
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先生成本地 .env}
      MYSQL_DATABASE: excommission
      MYSQL_USER: excommission
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成本地 .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D excommission -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
  api:
    build:
      context: .
      target: runtime
    image: excommission-local-runtime:dev
    volumes:
      - ./.local/users.json:/local/users.json:ro
      - ./.local/login-accounts.json:/local/login-accounts.json:ro
      - ./.local/external-identity.json:/local/external-identity.json:ro
      - ./.local/recovery-evidence.json:/local/recovery-evidence.json:ro
      - ./.local/grade-statistics.json:/local/grade-statistics.json:ro
      - ./.local/payment-results.json:/local/payment-results.json:ro
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_MODE: local
      LOCAL_REGISTRATION_ENABLED: ${LOCAL_REGISTRATION_ENABLED:-false}
      LOCAL_REGISTRATION_KEY: ${LOCAL_REGISTRATION_KEY:-}
      LOCAL_REGISTRATION_URL: ${LOCAL_REGISTRATION_URL:-}
      AUTH_LOCAL_ACCOUNTS_FILE: /local/login-accounts.json
      AUTH_EXTERNAL_FILE: /local/external-identity.json
      LOCAL_OPERATOR_TOKEN: ${LOCAL_OPERATOR_TOKEN:?请先生成本地凭据}
      LOCAL_APPROVER_TOKEN: ${LOCAL_APPROVER_TOKEN:?请先生成本地凭据}
      LOCAL_CURSOR_KEY: ${LOCAL_CURSOR_KEY:?请先生成本地凭据}
      LOCAL_SOURCE_KEY: ${LOCAL_SOURCE_KEY:?请先生成本地凭据}
      LOCAL_PAYMENT_KEY: ${LOCAL_PAYMENT_KEY:?请先生成本地凭据}
      LOCAL_PAYMENT_RESULTS_FILE: /local/payment-results.json
      LOCAL_USERS_FILE: /local/users.json
      LOCAL_RECOVERY_EVIDENCE_FILE: /local/recovery-evidence.json
      LOCAL_GRADE_STATISTICS_FILE: /local/grade-statistics.json
      DB_ADDRESS: mysql:3306
      DB_USER: excommission
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成本地 .env}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    image: excommission-local-runtime:dev
    entrypoint: ["/app/worker"]
    volumes:
      - ./.local/payment-results.json:/local/payment-results.json:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      LOCAL_PAYMENT_KEY: ${LOCAL_PAYMENT_KEY:?请先生成本地凭据}
      LOCAL_PAYMENT_RESULTS_FILE: /local/payment-results.json
      DB_ADDRESS: mysql:3306
      DB_USER: excommission
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成本地 .env}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 15
  database-check:
    profiles: ["verify"]
    build:
      context: .
      target: integration-test
    environment:
      TEST_MYSQL_ADDRESS: mysql:3306
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成本地 .env}
    depends_on:
      mysql:
        condition: service_healthy
  contract-check:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: deploy/local/contracts.Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
volumes:
  mysql-data:
